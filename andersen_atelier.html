<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>こども美術館 アトリエ受付状況</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #e8f4fd; --green: #4caf76; --green-light: #d4f0e0;
    --red: #f05a5a; --red-light: #fde8e8;
    --yellow: #f5c842; --yellow-light: #fef9e0;
    --gray: #b0b8c8; --gray-light: #f0f2f5;
    --ink: #2c3550; --white: #fff;
    --radius: 20px;
    --shadow: 0 4px 20px rgba(44,53,80,0.10);
    --shadow-lg: 0 8px 32px rgba(44,53,80,0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Zen Maru Gothic', sans-serif; background: var(--sky); min-height: 100vh; color: var(--ink); overflow-x: hidden; }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(circle at 10% 20%, rgba(255,220,100,0.18) 0%, transparent 40%),
      radial-gradient(circle at 85% 75%, rgba(76,175,118,0.15) 0%, transparent 40%),
      radial-gradient(circle at 50% 95%, rgba(100,160,240,0.12) 0%, transparent 40%);
  }
  .container { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 0 16px 60px; }
  header { text-align: center; padding: 36px 20px 20px; }
  .header-badge {
    display: inline-flex; align-items: center; gap: 8px; background: var(--white);
    border-radius: 100px; padding: 6px 18px; font-size: 12px; font-weight: 700;
    color: var(--green); box-shadow: var(--shadow); margin-bottom: 14px; letter-spacing: 0.08em;
  }
  .pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.5; transform:scale(.7); } }
  .header-title { font-size: clamp(22px,5vw,34px); font-weight: 900; line-height: 1.2; margin-bottom: 6px; }
  .header-sub { font-size: 13px; color: #6b7a9a; font-weight: 500; }
  .decorative-line { display: flex; justify-content: center; gap: 10px; margin: 18px auto 0; }
  .decorative-line span { width: 6px; height: 6px; border-radius: 50%; background: var(--yellow); }
  .decorative-line span:nth-child(2) { background: var(--green); }
  .decorative-line span:nth-child(4) { background: var(--red); width: 8px; height: 8px; }
  .decorative-line span:nth-child(6) { background: #64a0f0; }
  .last-updated { text-align: center; font-size: 12px; color: #8a97b5; margin: 6px 0 24px; font-weight: 500; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 28px; }
  .legend-item {
    display: flex; align-items: center; gap: 6px; background: var(--white);
    border-radius: 100px; padding: 5px 14px; font-size: 11.5px; font-weight: 700;
    box-shadow: 0 2px 8px rgba(44,53,80,0.07);
  }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 16px; margin-bottom: 40px; }
  .card {
    background: var(--white); border-radius: var(--radius); padding: 22px 18px 18px;
    box-shadow: var(--shadow); position: relative; overflow: hidden;
    transition: transform .2s ease, box-shadow .2s ease; animation: cardIn .4s ease both;
  }
  .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
  .card-accent { position: absolute; top: 0; left: 0; right: 0; height: 5px; border-radius: var(--radius) var(--radius) 0 0; }
  .card-number { font-size: 10px; font-weight: 700; letter-spacing: .12em; color: #aab0c8; margin-bottom: 2px; }
  .card-name { font-size: 15px; font-weight: 900; margin-bottom: 14px; line-height: 1.3; }
  .status-badge { display: inline-flex; align-items: center; border-radius: 100px; padding: 5px 13px; font-size: 12px; font-weight: 700; }
  .status-open { background: var(--green-light); color: #2e7d52; }
  .status-full { background: var(--red-light); color: #c0392b; }
  .status-prep { background: var(--yellow-light); color: #9a7a00; }
  .status-done { background: var(--gray-light); color: #7a8299; }
  .card-accent-open { background: linear-gradient(90deg,#4caf76,#6dd49c); }
  .card-accent-full { background: linear-gradient(90deg,#f05a5a,#f58b8b); }
  .card-accent-prep { background: linear-gradient(90deg,#f5c842,#f9da7a); }
  .card-accent-done { background: linear-gradient(90deg,#b0b8c8,#d0d5e0); }
  .state-msg { text-align: center; padding: 48px 20px; color: #8a97b5; font-size: 14px; font-weight: 500; }
  .holiday-banner {
    display: none; background: var(--red-light); color: #c0392b; border-radius: var(--radius);
    padding: 18px 20px; text-align: center; font-size: 15px; font-weight: 900;
    margin-bottom: 24px; box-shadow: var(--shadow);
  }
  .retry-btn {
    display: inline-block; margin-top: 14px; background: var(--ink); color: var(--white);
    border: none; border-radius: 100px; padding: 10px 26px;
    font-family: 'Zen Maru Gothic', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .footer-note { text-align: center; font-size: 11px; color: #aab0c8; margin-top: 10px; line-height: 1.7; }
  @media (max-width: 480px) {
    .grid { grid-template-columns: repeat(2,1fr); gap: 12px; }
    .card { padding: 18px 14px 14px; }
    .card-name { font-size: 13px; }
  }
  .card:nth-child(1){animation-delay:.05s} .card:nth-child(2){animation-delay:.10s}
  .card:nth-child(3){animation-delay:.15s} .card:nth-child(4){animation-delay:.20s}
  .card:nth-child(5){animation-delay:.25s} .card:nth-child(6){animation-delay:.30s}
  .card:nth-child(7){animation-delay:.35s} .card:nth-child(8){animation-delay:.40s}
  @keyframes cardIn { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="header-badge"><div class="pulse-dot"></div>リアルタイム更新中</div>
    <h1 class="header-title">アトリエ受付状況</h1>
    <p class="header-sub">アンデルセン公園 こども美術館</p>
    <div class="decorative-line"><span></span><span></span><span></span><span></span><span></span><span></span></div>
  </header>

  <p class="last-updated" id="lastUpdated">読み込み中...</p>

  <div class="holiday-banner" id="holidayBanner">本日は休園日です</div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#4caf76"></div>受付中</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f05a5a"></div>受付終了</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f5c842"></div>混雑中</div>
    <div class="legend-item"><div class="legend-dot" style="background:#b0b8c8"></div>休止中</div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="state-msg" id="stateMsg">受付状況を読み込んでいます...</div>

  <p class="footer-note">
    このページはスタッフが随時更新しています。<br>
    最新の情報は受付窓口でもご確認いただけます。
  </p>
</div>

<script>
// ===================================================================
// ★ ここに Google Apps Script のウェブアプリURLを貼り付けてください
// ===================================================================
const API_URL = 'https://script.google.com/macros/s/AKfycbweCx8zoxW5ljnNGkOTCI6LLkJPlTsgvy_PcjCopQXYmCkthIe5ExiUaGZN-Np5Cl6c/exec';

const CLS = { '受付中':'open', '受付終了':'full', '混雑中':'prep', '休止中':'done' };

function renderGrid(ateliers) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  ateliers.forEach(a => {
    const cls = CLS[a.status] || 'done';
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<div class="card-accent card-accent-' + cls + '"></div>' +
      '<div class="card-number">ATELIER ' + String(a.id).padStart(2,'0') + '</div>' +
      '<div class="card-name">' + a.name + '</div>' +
      '<span class="status-badge status-' + cls + '">' + a.status + '</span>';
    grid.appendChild(card);
  });
}

async function loadStatus() {
  const msg = document.getElementById('stateMsg');
  try {
    const res = await fetch(API_URL + '?t=' + Date.now());
    const data = await res.json();
    if (!data.ok) throw new Error('data');

    renderGrid(data.ateliers);
    document.getElementById('lastUpdated').textContent =
      data.updated ? '最終更新：' + data.updated : '最終更新：---';
    document.getElementById('holidayBanner').style.display = data.holiday ? 'block' : 'none';
    msg.style.display = 'none';

  } catch (err) {
    if (document.getElementById('grid').children.length === 0) {
      msg.style.display = 'block';
      msg.innerHTML = '受付状況を読み込めませんでした。<br>' +
        '<button class="retry-btn" onclick="loadStatus()">再読み込み</button>';
      document.getElementById('lastUpdated').textContent = '';
    }
  }
}

loadStatus();
setInterval(loadStatus, 30000);
</script>
</body>
</html>
